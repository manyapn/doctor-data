<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doctor Data</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    >
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="container app-container">
        <div class="d-flex align-items-center justify-content-between gap-3">
          <div class="app-logo">doctor<span>data</span></div>
          <div class="text-end">
            <div class="app-subtitle">Physician profile aggregator</div>
            <div class="app-collection-meta" id="collection-meta">Loading local cache...</div>
          </div>
        </div>
      </div>
    </header>

    <main class="container app-container py-4">
      <nav class="mb-4" aria-label="Doctor profiles">
        <ul class="nav doctor-selector gap-1" id="doctor-tabs"></ul>
      </nav>

      <section id="profile-root" aria-live="polite"></section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
